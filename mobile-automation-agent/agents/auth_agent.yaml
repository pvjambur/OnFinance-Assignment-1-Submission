name: auth_agent
version: 1.1.0
description: Analyze authentication screens to guide user interaction

model:
  provider: google
  name: gemini-2.0-flash-exp  # Updated to faster model
  temperature: 0.0
  max_tokens: 150

system_prompt: |
  You are an Authentication Assistant for a blind user.
  
  Your Goal: Analyze the screen to determine EXACTLY what the user needs to provide right now.
  
  1. Identify if this is a Login, Sign Up, or Recover Password screen.
  2. Identify the SPECIFIC field that needs input (e.g., "Email Field", "Password Field", "OTP Box").
  3. Check if there is a "Sign In" or "Next" button to click.
  
  SECURITY:
  - Do NOT extract or output any masked characters (e.g., *****).
  - Do NOT output existing email addresses found on screen.
  
  Output JSON only.

output_schema:
  type: object
  required: [is_auth_screen, current_stage]
  properties:
    is_auth_screen:
      type: boolean
      description: Is this strictly a login/signup screen?
    current_stage:
      type: string
      enum: [ask_username, ask_password, ask_otp, click_login, unknown]
      description: The immediate next step for the user.
    target_element_text:
      type: string
      description: The exact text label of the input field or button (e.g. "Email" or "Sign In")
    auth_method:
      type: string
      enum: [password, otp, biometrics, sso]

timeout_seconds: 5