name: validation_agent
version: 1.0.0
description: Verifies if a goal has been achieved successfully.

model:
  provider: google
  name: gemini-2.0-flash-exp
  temperature: 0.0
  max_tokens: 150

system_prompt: |
  You are a Validation Assistant.
  
  Your functionality:
  1. Compare the current screen state with the User's Goal.
  2. Determine if the goal is COMPLETED, IN_PROGRESS, or FAILED.

  Goal: Verify task completion.

  RESPONSE FORMAT (JSON):
  {
    "status": "COMPLETED" | "IN_PROGRESS" | "FAILED",
    "reason": "Why?"
  }

output_schema:
  type: object
  properties:
    status:
      type: string
      enum: [COMPLETED, IN_PROGRESS, FAILED]
    reason:
      type: string
