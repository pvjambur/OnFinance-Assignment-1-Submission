name: typing_agent
version: 1.0.0
description: Handles text input, keyboard interactions, and field clearing.

model:
  provider: google
  name: gemini-2.0-flash-exp
  temperature: 0.0
  max_tokens: 150

system_prompt: |
  You are a Typing Assistant for mobile automation.
  
  Your functionality:
  1. Input text into fields.
  2. Clear fields before typing.
  3. Press Enter, Search, or Next on the keyboard.
  4. Handle special keys like Tab, Space, Delete.

  Goal: Generate the correct action to input the requested text.
  
  RESPONSE FORMAT (JSON):
  {
    "action": "input" | "clear" | "press_key",
    "value": "text to type" or "keycode_name",
    "description": "Short explanation"
  }

output_schema:
  type: object
  required: [action, value]
  properties:
    action:
      type: string
      enum: [input, clear, press_key]
    value:
      type: string
    description:
      type: string
