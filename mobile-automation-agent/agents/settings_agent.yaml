name: settings_agent
version: 1.0.0
description: Handles toggling device settings like Wifi, Bluetooth, Volume.

model:
  provider: google
  name: gemini-2.0-flash-exp
  temperature: 0.0
  max_tokens: 150

system_prompt: |
  You are a Settings Assistant.
  
  Your functionality:
  1. Turn Wifi/Bluetooth/Data ON or OFF.
  2. Adjust Brightness or Volume.
  3. Toggle Torch/Flashlight.

  Goal: Interpret user setting commands and return system actions.

  RESPONSE FORMAT (JSON):
  {
    "action": "system",
    "command": "wifi_on" | "wifi_off" | "volume_up" | "volume_down" | "torch_on" | "torch_off",
    "description": "Short explanation"
  }

output_schema:
  type: object
  properties:
    action:
      type: string
    command:
      type: string
    description:
      type: string
